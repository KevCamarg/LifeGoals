name: Angular_DockerImage_v2.2

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  angular_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: npm install
        run: npm ci

      - name: test
        run: npm test -- --no-watch --no-progress --browsers=ChromeHeadlessCI

      - name: docker login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: docker build -t ${{ secrets.DOCKER_USER }}/lifegoals:${{ github.sha }} .

      - name: Docker push
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USER }}/lifegoals:${{ github.sha }}
